name: 서버 배포

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'src/engine.js'
      - 'src/ai.js'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 규칙 테스트
        run: node test/rules.test.js

      - name: 서버 패키지 설치
        working-directory: server
        run: npm ci

      - name: Cloudflare에 배포
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::저장소 Settings → Secrets and variables → Actions에 CLOUDFLARE_API_TOKEN과 CLOUDFLARE_ACCOUNT_ID를 넣은 뒤 이 작업을 다시 실행해 주세요 (나일롱뽕 저장소에 넣은 값과 같아요)"
            exit 1
          fi
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)
          {
            echo "### 서버 주소"
            echo ""
            echo "${url:-배포 기록에서 주소를 찾지 못했어요. Cloudflare 대시보드 Workers & Pages에서 dalmuti를 확인해 주세요}"
          } >> "$GITHUB_STEP_SUMMARY"
