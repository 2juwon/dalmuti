<title>달무티</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 궁정 연회장의 밤 — 남색 탁자 위 양피지 카드, 계급은 띠 색으로. 위: 궁정 서열(차례 순), 가운데: 판, 아래: 내 손패 */
:root {
  --bg: #11131b;
  --table: #1a2030;
  --table-hi: #232c41;
  --line: #34405a;
  --ink: #ece5d2;
  --muted: #98a1b5;
  --gold: #dbb25b;
  --gold-ink: #2a1f08;
  --vellum: #f3ead5;
  --vellum-edge: #d9ccad;
  --card-ink: #2b2333;
  --red: #e2806a;
  --green: #8cc296;
  --display: "Hahmlet", "Nanum Myeongjo", "Batang", serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --cw: 46px;
  color-scheme: dark;
}
@media (min-width: 640px) { :root { --cw: 60px; } }
@media (min-width: 1000px) { :root { --cw: 68px; } }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px;
  overflow-x: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

#app {
  min-height: 100%; display: grid; grid-template-rows: auto auto minmax(min-content, 1fr) auto; max-width: 980px; margin: 0 auto;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
}
@media (min-width: 420px) { #app { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); } }

/* 위 막대 */
.top { display: flex; align-items: center; gap: 10px; padding-block: 8px 6px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: .02em; color: var(--gold); }
.game-no { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.top .sp { flex: 1; }
.icon-btn { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 13px; color: var(--ink); }

/* 궁정 서열 */
.court { display: grid; grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); gap: 4px; padding-block: 4px 14px; }
.chip {
  position: relative; display: grid; justify-items: center; gap: 2px; padding: 6px 2px 5px; border-radius: 10px;
  background: var(--table); border: 1px solid transparent; min-width: 0; transition: border-color .2s, background .2s;
}
.chip .rk { font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.chip .rk.r0 { color: var(--gold); font-weight: 600; }
.chip .av {
  width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 14px;
  background: var(--av); color: #fff; box-shadow: inset 0 0 0 2px rgba(255,255,255,.12);
}
.chip .nm { font-size: 12px; font-weight: 600; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip .ct { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip.me { background: var(--table-hi); }
.chip.turn { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 0 18px -4px var(--gold); }
.chip.out { opacity: .55; }
.chip .say {
  position: absolute; bottom: -9px; left: 50%; transform: translateX(-50%); font-size: 10.5px; padding: 1px 6px; border-radius: 999px; background: var(--line); color: var(--ink);
  white-space: nowrap; font-variant-numeric: tabular-nums; pointer-events: none;
}
.chip .say.play { background: var(--gold); color: var(--gold-ink); font-weight: 600; }
.chip .say.place { background: var(--green); color: #102014; font-weight: 600; }
@media (max-width: 420px) { .court[data-n="7"] .chip .rk, .court[data-n="8"] .chip .rk { font-size: 9.5px; } .court[data-n="8"] .chip .av { width: 26px; height: 26px; font-size: 12px; } }

/* 탁자 */
.table {
  position: relative; min-height: 200px; border-radius: 22px; overflow: visible;
  background: radial-gradient(120% 90% at 50% 40%, var(--table-hi), var(--table) 70%);
  border: 1px solid var(--line); display: grid; place-items: safe center; padding: 14px;
}
.table::before { content: ""; position: absolute; inset: 10px; border: 1px dashed rgba(219,178,91,.18); border-radius: 16px; pointer-events: none; }
.center { display: grid; justify-items: center; gap: 10px; max-width: 100%; }
.trick { display: flex; justify-content: center; min-height: calc(var(--cw) * 1.42 * 1.25); align-items: center; }
.trick .card { --cw-scale: 1.25; }
.trick .card + .card { margin-left: calc(var(--cw) * -1 * var(--cw-scale, 1.25) * var(--ov, .55)); }
.trick .card { box-shadow: -2px 0 6px rgba(0,0,0,.35); }
.trick.fly .card { animation: fly .42s cubic-bezier(.2,.8,.25,1) both; }
.trick.fly .card:nth-child(2) { animation-delay: .03s } .trick.fly .card:nth-child(3) { animation-delay: .06s } .trick.fly .card:nth-child(4) { animation-delay: .09s }
@keyframes fly { from { transform: translate(var(--fx, 0), var(--fy, -60px)) scale(.55) rotate(-8deg); opacity: 0; } to { transform: none; opacity: 1; } }
.trick.sweep .card { animation: sweep .7s ease-in both; }
@keyframes sweep { to { transform: translateY(40px) scale(.8); opacity: 0; } }
.tlabel { font-size: 13px; color: var(--muted); text-align: center; text-wrap: balance; min-height: 1.4em; }
.tlabel b { color: var(--ink); font-weight: 600; }
.trail { display: flex; flex-wrap: wrap; gap: 4px 8px; justify-content: center; font-size: 11.5px; color: var(--muted); max-width: 100%; font-variant-numeric: tabular-nums; }
.trail span { white-space: nowrap; }
.empty-msg { font-family: var(--display); font-size: 18px; color: var(--muted); text-align: center; text-wrap: balance; }
.empty-msg small { display: block; font-family: var(--body); font-size: 12.5px; margin-top: 4px; }

/* 탁자 위 알림·선택 */
.prompt {
  display: grid; gap: 10px; justify-items: center; text-align: center; max-width: 440px; padding: 16px 16px 14px;
  background: rgba(17,19,27,.82); border: 1px solid var(--line); border-radius: 16px; backdrop-filter: blur(4px);
}
.prompt h3 { margin: 0; font-family: var(--display); font-size: 19px; font-weight: 800; color: var(--gold); text-wrap: balance; }
.prompt p { margin: 0; font-size: 13.5px; line-height: 1.55; color: var(--ink); text-wrap: pretty; }
.prompt .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.prompt .tx { display: grid; gap: 6px; width: 100%; }
.prompt .tx-line { display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.prompt .tx-line b { color: var(--ink); }
.mini-cards { display: inline-flex; gap: 3px; }
.mini-cards .card { --cw-scale: .62; }

.banner {
  position: absolute; left: 50%; top: 18%; transform: translate(-50%, -10px); opacity: 0; pointer-events: none;
  font-family: var(--display); font-weight: 800; font-size: 28px; color: var(--gold); text-shadow: 0 2px 18px rgba(0,0,0,.6);
  white-space: nowrap; transition: opacity .25s, transform .25s;
}
.banner.on { opacity: 1; transform: translate(-50%, 0); }
.banner.small { font-size: 17px; color: var(--ink); }

/* 내 손패 */
.me { display: grid; gap: 8px; padding-block: 8px max(10px, env(safe-area-inset-bottom, 0px)); }
.hint { font-size: 13px; text-align: center; color: var(--muted); min-height: 1.3em; text-wrap: balance; }
.hint b { color: var(--gold); font-weight: 600; }
.hint.warn { color: var(--red); }
.hand { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 6px; padding-top: 12px; min-height: calc(var(--cw) * 1.42 + 12px); }
.stack { position: relative; background: none; border: 0; padding: 0; transition: transform .15s; }
.stack .card { box-shadow: var(--pile), 0 1px 3px rgba(0,0,0,.4); }
.stack .badge {
  position: absolute; bottom: -6px; right: -6px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; display: grid; place-items: center;
  background: var(--bg); border: 1px solid var(--line); font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums;
}
.stack .pick {
  position: absolute; top: -8px; left: -7px; height: 20px; min-width: 20px; padding: 0 6px; border-radius: 10px;
  background: var(--gold); color: var(--gold-ink); font-size: 11.5px; font-weight: 700; display: grid; place-items: center; font-variant-numeric: tabular-nums;
}
.stack.sel { transform: translateY(-10px); }
.stack.sel .card { outline: 2px solid var(--gold); outline-offset: 1px; }
.stack.dim .card { filter: saturate(.3) brightness(.55); }
.stack.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-4px) } 75% { transform: translateX(4px) } }
.actions { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }
.btn {
  border: 1px solid var(--line); background: var(--table); border-radius: 12px; padding: 12px 14px; font-weight: 600; font-size: 15px;
  transition: background .15s, opacity .15s;
}
.btn.primary { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
.btn:disabled { opacity: .38; cursor: default; }
.btn.ghost { background: transparent; }
.btn.sm { padding: 8px 14px; font-size: 13.5px; border-radius: 10px; }

/* 카드 — 타로 카드 그림은 src/art.js */
.card {
  --w: calc(var(--cw) * var(--cw-scale, 1));
  position: relative; width: var(--w); height: calc(var(--w) * 1.4167); border-radius: calc(var(--w) * .085);
  background: var(--vellum); flex: none; overflow: hidden; display: block;
}
.card svg.art { display: block; width: 100%; height: 100%; }
.card svg.art text.no { font-family: var(--display); font-weight: 800; }
.card svg.art text.nm { font-family: var(--body); font-weight: 600; font-size: 6.6px; letter-spacing: -.02em; }
.card.ghost-j::after { content: "광대"; position: absolute; top: 3px; right: 3px; font-size: 8px; color: var(--card-ink); background: rgba(255,255,255,.8); border-radius: 3px; padding: 0 2px; }

/* 시트 */
.sheet-wrap { position: fixed; inset: 0; z-index: 20; display: grid; align-items: end; justify-items: center; background: rgba(6,7,12,.6); padding-top: env(safe-area-inset-top, 0px); }
@media (min-width: 640px) { .sheet-wrap { align-items: center; } }
.sheet {
  width: 100%; max-width: 520px; max-height: calc(100% - 24px); overflow: auto; background: var(--table); border: 1px solid var(--line);
  border-radius: 22px 22px 0 0; padding: 22px max(18px, env(safe-area-inset-left, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-right, 0px));
  display: grid; gap: 16px; animation: up .28s cubic-bezier(.2,.8,.25,1);
}
@media (min-width: 640px) { .sheet { border-radius: 22px; } }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
.sheet h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 24px; color: var(--gold); text-wrap: balance; }
.sheet h2.hero { font-size: 44px; letter-spacing: .03em; }
.sheet .lead { margin: -6px 0 0; color: var(--muted); line-height: 1.55; text-wrap: pretty; }
.field { display: grid; gap: 7px; }
.field > label, .field > .lb { font-size: 12.5px; color: var(--muted); letter-spacing: .02em; }
.input { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; color: var(--ink); font: inherit; font-size: 15px; width: 100%; box-sizing: border-box; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { flex: 1 1 auto; min-width: 54px; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 13.5px; }
.seg button[aria-pressed="true"] { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); font-weight: 600; }
.seg-note { font-size: 12px; color: var(--muted); line-height: 1.5; }
.sheet .btns { display: grid; gap: 8px; }
.list { display: grid; gap: 6px; }
.lrow { display: grid; grid-template-columns: 28px 64px 1fr auto auto; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 10px; background: var(--bg); font-variant-numeric: tabular-nums; }
.lrow.mine { outline: 1px solid var(--gold); }
.lrow .pl { font-family: var(--display); font-weight: 800; color: var(--gold); text-align: center; }
.lrow .rn { font-size: 12px; color: var(--muted); }
.lrow .who { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow .pt { color: var(--green); font-size: 12.5px; }
.lrow .tot { font-weight: 700; min-width: 40px; text-align: right; }
.rules { display: grid; gap: 10px; line-height: 1.6; font-size: 13.5px; }
.rules h4 { margin: 6px 0 0; font-family: var(--display); color: var(--gold); font-size: 15px; }
.rules p, .rules ul { margin: 0; color: var(--ink); }
.rules ul { padding-left: 18px; display: grid; gap: 4px; }
.rules .ladder { display: flex; flex-wrap: wrap; gap: 6px; }
.rules .ladder .card { --cw-scale: .78; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; background: var(--bg); border-radius: 10px; border: 1px solid var(--line); }
.switch input { width: 20px; height: 20px; accent-color: var(--gold); }

/* 사람들과 */
.seg.mode button { padding: 11px 10px; font-size: 14.5px; font-weight: 600; }
.joinrow { display: flex; gap: 8px; }
.joinrow .input { flex: 1; min-width: 0; letter-spacing: .12em; font-variant-numeric: tabular-nums; }
.joinrow .btn { flex: none; }
.warn-text { color: var(--red); }
.btn.warn { border-color: var(--red); color: var(--red); }
.conn { font-size: 12px; color: var(--gold-ink); background: var(--gold); border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
.clock { justify-self: center; font-size: 13px; font-weight: 600; color: var(--gold); font-variant-numeric: tabular-nums; padding: 2px 12px; border: 1px solid var(--gold); border-radius: 999px; }
.clock.low { color: var(--red); border-color: var(--red); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .55; } }
.chip .bar { position: absolute; left: 10px; right: 10px; top: 3px; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.chip .bar i { display: block; height: 100%; background: var(--gold); transform-origin: left center; transition: transform .25s linear; }
.lrow.seat { grid-template-columns: 30px 1fr auto; }
.lrow .av { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 12.5px; background: var(--av); color: #fff; }
.lrow .av.ghost { background: transparent; border: 1px dashed var(--line); }
.lrow.seat.empty .who { color: var(--muted); font-weight: 400; }
.linkbox { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); min-width: 0; }
.linkbox span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; color: var(--muted); user-select: text; -webkit-user-select: text; }
.linkbox .btn { flex: none; }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 30; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>

<div id="app">
  <header class="top">
    <div class="brand">달무티</div>
    <div class="game-no" id="gameNo"></div>
    <div class="conn" id="conn" hidden></div>
    <div class="sp"></div>
    <button class="icon-btn" id="rulesBtn" type="button">규칙</button>
    <button class="icon-btn" id="menuBtn" type="button">메뉴</button>
  </header>
  <section class="court" id="court" aria-label="궁정 서열 (차례 순서)"></section>
  <section class="table" id="table">
    <div class="center" id="center"></div>
    <div class="banner" id="banner"></div>
  </section>
  <section class="me">
    <div class="clock" id="clock" hidden></div>
    <div class="hint" id="hint"></div>
    <div class="hand" id="hand" aria-label="내 손패"></div>
    <div class="actions">
      <button class="btn" id="passBtn" type="button">패스</button>
      <button class="btn primary" id="playBtn" type="button">내기</button>
    </div>
  </section>
</div>
<div class="sheet-wrap" id="sheetWrap" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<canvas id="fx"></canvas>

<script>
(function () {
'use strict';
var DM = window.DM, AI = window.DMAI;
var KEY = 'dalmuti-v1';
var NAMES = ['민지', '도윤', '서연', '하준', '지우', '은우', '수아', '시우', '하린'];
var AVATAR = ['#8a4fb3', '#3d7fae', '#b0583c', '#3f8a6e', '#a8892f', '#a34a72', '#5b6aa8', '#6f8a3c'];


function el(id) { return document.getElementById(id); }
function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function cardHTML(v, extra) {
  return '<div class="card c' + v + (extra ? ' ' + extra : '') + '" role="img" aria-label="' + (v === 13 ? '어릿광대' : v + ' ' + DM.CARD_NAMES[v]) + '">' + DMArt.svg(v) + '</div>';
}
function miniCards(list) { return '<span class="mini-cards">' + list.map(function (v) { return cardHTML(v); }).join('') + '</span>'; }
function moveText(m) {
  if (m.v === 13) return '어릿광대 ×' + m.j;
  return m.v + ' ×' + (m.n + m.j) + (m.j ? ' (광대 ' + m.j + ')' : '');
}
function josa(word, a, b) { var c = word.charCodeAt(word.length - 1); if (c < 0xac00 || c > 0xd7a3) return word + b; return word + (((c - 0xac00) % 28) ? a : b); }

/* ───── 설정·저장 ───── */
var settings = { name: '나', n: 5, level: 'normal', games: 5, firstTax: true, autoPass: true, sound: true };
var S = null;        // 게임 상태 (온라인이면 서버가 보내 준 내 보기)
var ME = 0;          // 내 자리 (혼자 하기는 0, 온라인은 서버가 정함)
var NET = null;      // 온라인 접속 정보 { code, room, offset, ... }
var soloS = null;    // 온라인에 들어가 있는 동안 혼자 하던 판을 보관
var SERVER = '__SERVER_URL__';
var ui = { sel: {}, seenSeq: 0, block: null, taxShown: 0, revoShown: 0, timer: null };
function load() {
  try { var d = JSON.parse(localStorage.getItem(KEY) || 'null'); if (d) { if (d.settings) Object.assign(settings, d.settings); if (d.state && d.state.v === DM.VERSION) S = d.state; if (d.ui) { ui.taxShown = d.ui.taxShown || 0; ui.revoShown = d.ui.revoShown || 0; } } } catch (e) {}
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify({ settings: settings, state: NET ? soloS : S, ui: NET ? {} : { taxShown: ui.taxShown, revoShown: ui.revoShown } })); } catch (e) {}
}

/* ───── 소리 ───── */
var AC = null;
function ac() { if (!settings.sound) return null; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) { AC = null; } return AC; }
function tone(f, d, type, vol, when) {
  var a = ac(); if (!a) return; var t = a.currentTime + (when || 0);
  var o = a.createOscillator(), g = a.createGain(); o.type = type || 'triangle'; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol || .12, t + .01); g.gain.exponentialRampToValueAtTime(.0008, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .02);
}
function slap() {
  var a = ac(); if (!a) return; var len = a.sampleRate * .09, b = a.createBuffer(1, len, a.sampleRate), d = b.getChannelData(0);
  for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  var s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(); f.type = 'bandpass'; f.frequency.value = 1800; g.gain.value = .5;
  s.buffer = b; s.connect(f); f.connect(g); g.connect(a.destination); s.start();
}
var SND = {
  play: slap,
  pass: function () { tone(330, .12, 'sine', .06); },
  clear: function () { tone(520, .1, 'sine', .05); tone(390, .14, 'sine', .05, .07); },
  turn: function () { tone(880, .12, 'sine', .07); tone(1175, .16, 'sine', .06, .08); },

    '<p class="seg-note">규칙은 나무위키 「달무티」 문서를 따랐어요. 상인끼리 카드를 바꾸는 선택 규칙은 넣지 않았어요.</p>' +
    '</div><div class="btns"><button class="btn primary" id="rBack" type="button" data-focus>' + (back ? '돌아가기' : '닫기') + '</button></div>', afterSheet, 'rules');
  el('rBack').onclick = function () { if (back) { sheetClose = null; back(); } else closeSheet(); };
}
el('menuBtn').onclick = function () { ac(); clearTimeout(ui.timer); if (sheetKind === 'joining') return; showMenu(); };
el('rulesBtn').onclick = function () { clearTimeout(ui.timer); if (sheetKind === 'joining') return; showRules(null); };

/* ───── 색종이 ───── */
function confetti() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var cv = el('fx'), x = cv.getContext('2d'), W = cv.width = innerWidth, H = cv.height = innerHeight, ps = [];
  var cols = ['#dbb25b', '#9c2f55', '#6c3196', '#2f7560', '#f3ead5', '#2b6491'];
  for (var i = 0; i < 140; i++) ps.push({ x: W / 2, y: H * .35, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4, r: Math.random() * 6 + 4, c: cols[i % cols.length], a: Math.random() * 6, s: Math.random() * .3 - .15 });
  var t0 = performance.now();
  (function f(t) {
    x.clearRect(0, 0, W, H);
    ps.forEach(function (p) { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.s; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); x.restore(); });
    if (t - t0 < 3200) requestAnimationFrame(f); else x.clearRect(0, 0, W, H);
  })(t0);
}

/* ───── 사람들과 (온라인) ───── */
var ROOM_KEY = 'dalmuti-room', PID_KEY = 'dalmuti-pid', memPid = null, startNote = '';
function newUi() { return { sel: {}, seenSeq: 0, block: null, taxShown: 0, revoShown: 0, timer: null }; }
function hex(n) {
  var a = new Uint8Array(n);
  try { crypto.getRandomValues(a); } catch (e) { for (var i = 0; i < n; i++) a[i] = Math.random() * 256; }
  return Array.prototype.map.call(a, function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
}
function myPid() {
  try {
    var p = localStorage.getItem(PID_KEY);
    if (!/^[a-f0-9]{32}$/.test(p || '')) { p = hex(16); localStorage.setItem(PID_KEY, p); }
    return p;
  } catch (e) { return memPid || (memPid = hex(16)); }
}
function seatNote(pid) {
  if (!NET || !NET.room) return '';
  var x = NET.room.seats[pid];
  if (!x) return '';
  if (x.kind === 'human' && !x.online) return ' · 끊김';
  if (x.away) return ' · 자리 비움';
  return '';
}
function showConn(t) { var c = el('conn'); c.textContent = t; c.hidden = false; }
function hideConn() { el('conn').hidden = true; }
function clearTable() {
  el('court').innerHTML = ''; el('gameNo').textContent = '';
  el('center').innerHTML = NET ? '<div class="empty-msg">대기실<small>방장이 시작하면 계급을 뽑아요</small></div>' : '';
  el('hand').innerHTML = ''; hint('');
  el('passBtn').disabled = true; el('playBtn').disabled = true; el('playBtn').textContent = '내기';
  el('clock').hidden = true;
}
function afterSheet() {
  if (NET && NET.room && NET.room.status === 'waiting') showLobby();
  else if (NET && S && (S.phase === 'gameEnd' || S.phase === 'matchEnd')) showResult();
  else schedule();
}
function showLobbyOrGame() {
  if (NET && NET.room && NET.room.status === 'waiting') showLobby(); else if (sheetKind === 'start') closeSheet();
}

// 남은 시간: 차례인 사람 칩의 막대, 내 차례면 손패 위에 초, 결과 화면엔 다음 판까지
function tick() {
  if (!NET || !NET.room) return;
  var dl = NET.room.deadline, left = dl ? Math.max(0, dl - (Date.now() + NET.offset)) : 0;
  var total = (NET.room.settings.turnSec || 20) * 1000;
  var bar = document.querySelector('.chip .bar i');
  if (bar) bar.style.transform = 'scaleX(' + Math.min(1, left / total).toFixed(3) + ')';
  var q = S && S.phase !== 'gameEnd' && S.phase !== 'matchEnd' && DM.pending(S);
  var mine = q && q.pid === ME && dl && ui.sentSeq !== S.seq;
  var ck = el('clock');
  if (mine) {
    var sec = Math.ceil(left / 1000);
    ck.hidden = false; ck.textContent = '남은 시간 ' + sec + '초';
    ck.classList.toggle('low', sec <= 5);
    if (sec <= 5 && sec > 0 && ui.beep !== S.seq + ':' + sec) { ui.beep = S.seq + ':' + sec; tone(1320, .06, 'sine', .05); }
  } else ck.hidden = true;
  var nc = el('nextClock');
  if (nc) nc.textContent = dl ? '다음 판까지 ' + Math.ceil(left / 1000) + '초' : '';
}
setInterval(tick, 250);

function showLobby() {
  var r = NET.room, host = r.host === ME, st = r.settings;
  var humans = r.seats.filter(function (x) { return x.kind === 'human'; }).length, empty = r.seats.length - humans;
  var link = location.origin + location.pathname + '#' + r.code;
  var rows = r.seats.map(function (x, i) {
    if (x.kind !== 'human') return '<div class="lrow seat empty"><span class="av ghost"></span><span class="who">빈자리</span><span class="pt">시작하면 컴퓨터</span></div>';
    return '<div class="lrow seat' + (i === ME ? ' mine' : '') + '"><span class="av" style="--av:' + AVATAR[i % AVATAR.length] + '">' + esc(x.name.slice(0, 1)) + '</span>' +
      '<span class="who">' + esc(x.name) + (i === ME ? ' (나)' : '') + '</span><span class="pt">' + (i === r.host ? '방장' : x.online ? '' : '연결 끊김') + '</span></div>';
  }).join('');
  var lv = { easy: '느긋한', normal: '보통', hard: '고수' };
  var opts = host ?
    '<div class="field"><div class="lb">인원 (빈자리는 컴퓨터)</div>' + seg('max', [[4, '4명'], [5, '5명'], [6, '6명'], [7, '7명'], [8, '8명']], st.max) + '</div>' +
    '<div class="field"><div class="lb">차례마다 제한 시간</div>' + seg('turnSec', [[10, '10초'], [15, '15초'], [20, '20초'], [30, '30초'], [60, '60초']], st.turnSec) + '</div>' +
    '<div class="field"><div class="lb">판 수</div>' + seg('games', [[3, '3판'], [5, '5판'], [10, '10판']], st.games) + '</div>' +
    '<div class="field"><div class="lb">컴퓨터 실력</div>' + seg('level', [['easy', '느긋한'], ['normal', '보통'], ['hard', '고수']], st.level) + '</div>' +
    '<div class="field"><div class="lb">첫 판</div>' + seg('firstTax', [['1', '계급대로 세금'], ['0', '평등하게']], st.firstTax ? '1' : '0') + '</div>' +
    '<label class="switch"><span>모르는 사람도 빠른 참가로 들어오기</span><input type="checkbox" id="pubIn"' + (st.public ? ' checked' : '') + '></label>'
    : '<p class="seg-note">' + st.max + '명 · 제한 시간 ' + st.turnSec + '초 · ' + st.games + '판 · 컴퓨터 ' + lv[st.level] + ' · 첫 판 ' + (st.firstTax ? '세금 있음' : '평등하게') + '</p>';
  el('sheet').dataset.dismiss = '0';
  openSheet('<h2>방 ' + r.code + '</h2>' +
    '<p class="lead">친구에게 방 번호나 초대 링크를 보내 주세요.</p>' +
    '<div class="linkbox"><span id="linkText">' + esc(link) + '</span><button class="btn sm" id="copyBtn" type="button">링크 복사</button></div>' +
    '<div class="list">' + rows + '</div>' + opts +
    '<div class="btns">' + (host ? '<button class="btn primary" id="goBtn" type="button">시작하기 · 사람 ' + humans + '명' + (empty ? ' + 컴퓨터 ' + empty + '명' : '') + '</button>'
      : '<p class="seg-note" style="text-align:center">방장이 시작하길 기다리는 중이에요</p>') +
    '<button class="btn ghost" id="outBtn" type="button">방 나가기</button></div>', null, 'lobby');
  el('copyBtn').onclick = function () {
    var b = this;
    var done = function () { b.textContent = '복사했어요'; setTimeout(function () { if (b.isConnected) b.textContent = '링크 복사'; }, 1500); };
    try { navigator.clipboard.writeText(link).then(done, function () { selectText(el('linkText')); }); } catch (e) { selectText(el('linkText')); }
  };
  el('outBtn').onclick = function () { Net.leave(); };
  if (!host) return;
  el('goBtn').onclick = function () { ac(); this.disabled = true; Net.send({ t: 'start' }); };
  el('pubIn').onchange = function () { Net.send({ t: 'settings', settings: { public: this.checked } }); };
  el('sheet').querySelectorAll('[data-seg]').forEach(function (g) {
    g.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      var k = g.dataset.seg, v = b.dataset.val, o = {};
      o[k] = k === 'level' ? v : k === 'firstTax' ? v === '1' : +v;
      Net.send({ t: 'settings', settings: o });
    });
  });
}
function selectText(node) { try { var r = document.createRange(); r.selectNodeContents(node); var s = getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) {} }

var Net = {
  api: function (path, body, get) {
    return fetch(SERVER + path, get ? {} : { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) })
      .then(function (r) { return r.json(); });
  },
  stats: function () {
    var line = el('statsLine');
    if (startNote) { line.textContent = startNote; line.classList.add('warn-text'); startNote = ''; return; }
    Net.api('/api/stats', null, true).then(function (d) {
      if (!el('statsLine')) return;
      el('statsLine').textContent = d.waitingPlayers ? '지금 ' + d.waitingPlayers + '명이 방에서 기다려요' + (d.playingRooms ? ' · ' + d.playingRooms + '개 방에서 게임 중' : '')
        : (d.playingRooms ? d.playingRooms + '개 방에서 게임 중 · ' : '') + '빠른 참가를 누르면 새 방을 열고 기다려요';
    }).catch(function () { if (el('statsLine')) el('statsLine').textContent = '서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요'; });
  },
  enter: function (kind, code, silent) {
    settings.mode = 'online'; save();
    if (!silent) { el('sheet').dataset.dismiss = '0'; openSheet('<h2>들어가는 중…</h2><p class="lead">방을 찾고 있어요.</p>', null, 'joining'); }
    var fail = function () { startNote = '서버에 연결하지 못했어요. 잠시 뒤 다시 해 주세요'; closeSheet(); settings.mode = 'online'; showStart(); };
    if (kind === 'quick') Net.api('/api/quick').then(function (r) { r.code ? Net.connect(r.code) : fail(); }, fail);
    else if (kind === 'make') Net.api('/api/rooms', { public: false }).then(function (r) { r.code ? Net.connect(r.code) : fail(); }, fail);
    else Net.connect(code);
  },
  connect: function (code) {
    if (!NET) { soloS = S; S = null; NET = { code: code, room: null, offset: 0, retry: 0, gen: -1 }; ME = 0; ui = newUi(); clearTimeout(ui.timer); }
    try { localStorage.setItem(ROOM_KEY, code); } catch (e) {}
    try { if (location.hash !== '#' + code) history.replaceState(null, '', '#' + code); } catch (e) {}
    var url = SERVER.replace(/^http/, 'ws') + '/ws/' + code + '?pid=' + myPid() + '&name=' + encodeURIComponent(settings.name || '나');
    var ws;
    try { ws = new WebSocket(url); } catch (e) { Net.retry(); return; }
    NET.ws = ws;
    ws.onopen = function () { if (NET) NET.retry = 0; hideConn(); };
    ws.onmessage = function (e) {
      if (e.data === 'pong' || !NET || NET.ws !== ws) return;
      var m; try { m = JSON.parse(e.data); } catch (x) { return; }
      if (m.t === 'error') {
        if (m.fatal) { NET.fatal = true; Net.drop(m.message); }
        else { hint(esc(m.message), true); ui.sentSeq = -1; if (S) setTimeout(function () { if (S) renderHand(); }, 1500); }
        return;
      }
      if (m.t === 'state') Net.onState(m);
    };
    ws.onclose = function () { if (NET && NET.ws === ws && !NET.fatal && !NET.leaving) Net.retry(); };
  },
  retry: function () {
    if (!NET) return;
    NET.retry++;
    if (NET.retry > 10) { Net.drop('서버에 다시 연결하지 못했어요. 잠시 뒤 다시 들어와 주세요'); return; }
    showConn('연결이 끊겼어요 · 다시 연결하는 중');
    setTimeout(function () { if (NET && !NET.leaving) Net.connect(NET.code); }, Math.min(5000, 500 * NET.retry));
  },
  send: function (o) {
    if (NET && NET.ws && NET.ws.readyState === 1) NET.ws.send(JSON.stringify(o));
    else if (NET) { showConn('연결 중이에요 · 잠시만요'); ui.sentSeq = -1; }
  },
  leave: function () {
    if (!NET) return;
    NET.leaving = true;
    try { NET.ws.send(JSON.stringify({ t: 'leave' })); } catch (e) {}
    var ws = NET.ws; setTimeout(function () { try { ws.close(); } catch (e) {} }, 300);
    Net.exit(); showStart();
  },
  drop: function (msg) {
    var ws = NET && NET.ws;
    Net.exit();
    try { ws && ws.close(); } catch (e) {}
    startNote = msg || '';
    settings.mode = 'online';
    showStart();
  },
  exit: function () {
    try { localStorage.removeItem(ROOM_KEY); } catch (e) {}
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    NET = null; ME = 0; S = soloS; soloS = null; ui = newUi();
    hideConn(); closeSheet();
    if (S) { ui.seenSeq = S.seq; render(); } else clearTable();
  },
  onState: function (m) {
    NET.room = m.room; NET.offset = m.now - Date.now(); ME = m.seat;
    hideConn();
    if (m.room.status === 'waiting' || !m.view) {
      S = null; NET.gen = -1; clearTable();
      if (sheetKind !== 'menu' && sheetKind !== 'rules') showLobby();
      return;
    }
    var v = m.view, fresh = NET.gen !== m.room.gen || !S;
    NET.gen = m.room.gen;
    if (fresh) { ui = newUi(); ui.seenSeq = v.seq; if (sheetKind === 'lobby' || sheetKind === 'joining' || sheetKind === 'start') closeSheet(); }
    var news = fresh ? [] : v.log.filter(function (e) { return e.seq > ui.seenSeq; });
    ui.seenSeq = v.seq;
    S = v;
    if (m.timedOut) banner('시간이 지나 자동으로 했어요', true);
    react(news);
    var ended = S.phase === 'gameEnd' || S.phase === 'matchEnd';
    if (S.phase === 'drawn') { if (!ui.drawSeen && sheetKind !== 'menu' && sheetKind !== 'rules') { ui.drawSeen = true; showDraw(); } }
    else if (sheetKind === 'draw') closeSheet();
    if (ended) {
      var justEnded = news.some(function (e) { return e.t === 'end'; });
      if (!justEnded && (sheetKind === 'result' || sheetKind === null || fresh)) showResult();
    } else if (sheetKind === 'result' || sheetKind === 'lobby' || sheetKind === 'joining') closeSheet();
    render(); schedule(); tick();
  }
};
setInterval(function () { if (NET && NET.ws && NET.ws.readyState === 1) { try { NET.ws.send('ping'); } catch (e) {} } }, 25000);

/* ───── 부팅 ───── */
function start(data) {
  load();
  if (data && data.state) { S = data.state; if (data.settings) Object.assign(settings, data.settings); }
  var hash = (location.hash.match(/^#(\d{6})$/) || [])[1];
  var saved = null; try { saved = localStorage.getItem(ROOM_KEY); } catch (e) {}
  if (SERVER && saved && /^\d{6}$/.test(saved) && (!hash || hash === saved)) { Net.enter('join', saved, true); return; }
  if (S) render();
  showStart(SERVER && hash ? hash : null);
}
try { window.claude && window.claude.hot && window.claude.hot.snapshot(function () { return { state: S, settings: settings }; }); } catch (e) {}
window.__dalmuti = { get: function () { return S; }, commit: commit, ui: function () { return ui; }, settings: settings, net: function () { return NET; }, me: function () { return ME; } };
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
